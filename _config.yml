title: "EK1225 Individual Practice Problems"
author: "Brian DePasquale"
copyright: "2026 Brian DePasquale"
repository:
  url: "https://github.com/BU-EK125/EK1225-IPP"
  branch: main

sphinx:
  config:
    # _slides_build/ is generated by build_slides.sh (not committed --
    # see .gitignore) and copied verbatim to the site root, so each
    # deck lands at <DeckName>/index.html for _toc.yml's url: entries
    # to link straight to.
    html_extra_path: ["_slides_build"]

# README.md and CONTRIBUTING.md are repo/instructor documentation, not
# student-facing content, so they're excluded from the public site too.
# docs/ holds the original source PDFs (not book content), slides/
# (marimo .py sources) aren't book content either, and notebooks/*.ipynb
# are raw artifacts for the Colab button to open, not meant to be
# built/executed/rendered as book pages themselves.
exclude_patterns: ["docs/*", "docs/**/*", "slides/*", "slides/**/*", "notebooks/*", "notebooks/**/*", "README.md", "CONTRIBUTING.md"]
